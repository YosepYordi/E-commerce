spring.application.name=Ecommerce

# MySQL is the runtime default. Tests explicitly activate the test profile.
spring.profiles.default=mysql
spring.config.import=optional:file:.env[.properties]

# Server Port
server.port=8080

spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Security configuration is supplied through environment variables in runtime.
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.admin-username=${ADMIN_USERNAME:}
app.security.admin-password-hash=${ADMIN_PASSWORD_HASH:}

# Comma-separated origins. Credentials are enabled for the HttpSession cart.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
