name: E-commerce CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Otorgar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: 4. Ejecutar pruebas automáticas (mvn clean test)
        run: ./mvnw clean test

      - name: 5. Compilar y empaquetar artefacto (mvn clean package)
        run: ./mvnw clean package -DskipTests=false

      - name: 6. Publicar reporte de artefacto generado
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-app-jar
          path: target/*.jar
          retention-days: 5
